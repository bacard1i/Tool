name: Keep Render Alive

on:
  schedule:
    - cron: '*/14 * * * *'   # Every 14 minutes
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Service
        run: |
          curl -s https://tool-plum.vercel.app || true
          echo "Ping sent to keep Render awake"