name: CI - Empire Audio Pipeline

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # Required for CodeQL

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt || echo "No requirements.txt yet"

      - name: Basic Schism Import Test
        run: |
          python -c "
          try:
              from schism import Schism
              print('Schism module imported successfully')
          except Exception as e:
              print(f'Import test failed: {e}')
          "

      - name: Lint Python Files
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python, javascript   # Analyzes both main.py and module.js
          queries: security-extended       # Most comprehensive security checks

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python,/language:javascript"

      - name: Upload CodeQL Results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif